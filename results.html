<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dose review results (admin)</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .rwrap { max-width: 980px; margin: 0 auto; padding: 24px 18px 80px; }
    .gate { margin: 40px auto; max-width: 420px; }
    .gate input { width: 100%; padding: 10px; font-size: 15px; margin: 8px 0; }
    .btn { background: #1f6feb; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin: 10px 0 24px; font-size: 13px; }
    th, td { border: 1px solid #2a3340; padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #11161d; }
    .sub { border: 1px solid #2a3340; border-radius: 10px; padding: 16px; margin: 18px 0; }
    .src-opus { color: #d2a8ff; } .src-gpt { color: #7ee787; } .src-real { color: #ffa657; }
    .err { color: #ff7b72; } .muted { color: #9aa7b4; font-size: 13px; }
    code { background: #0f141b; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="rwrap">
    <h1>Dose review results <span class="muted">(admin, unblinded)</span></h1>
    <div id="gate" class="gate">
      <label class="muted">Admin key</label>
      <input id="key" type="password" placeholder="ADMIN_KEY" autocomplete="off" />
      <button id="load" class="btn">Load results</button>
      <div id="err" class="err"></div>
    </div>
    <div id="app" hidden>
      <h2>Source mapping (unblinded)</h2>
      <div id="mapping"></div>
      <h2>Submissions (<span id="count">0</span>)</h2>
      <div id="subs"></div>
    </div>
  </div>

  <script>
    function srcSpan(s) { return '<span class="src-' + s + '">' + s + '</span>'; }
    var MAP = {};

    function renderMapping(m) {
      var html = '<table><tr><th>Case</th><th>A</th><th>B</th><th>C</th></tr>';
      Object.keys(m).forEach(function (cid) {
        html += '<tr><td>' + cid + '</td><td>' + srcSpan(m[cid].A) + '</td><td>' + srcSpan(m[cid].B) + '</td><td>' + srcSpan(m[cid].C) + '</td></tr>';
      });
      document.getElementById("mapping").innerHTML = html + '</table>';
    }

    function renderSubs(subs) {
      document.getElementById("count").textContent = subs.length;
      var root = document.getElementById("subs");
      root.innerHTML = "";
      subs.forEach(function (rec) {
        var box = document.createElement("div"); box.className = "sub";
        var s = rec.submission || {};
        var h = '<div class="muted">' + (rec.reviewer || "anonymous") + " — " + (rec.ts || "") + "</div>";
        var cases = s.cases || {};
        Object.keys(cases).forEach(function (cid) {
          var c = cases[cid], map = MAP[cid] || {};
          h += '<h4>' + cid + " — most defensible: " + (c.most_defensible || "?") +
            " (" + srcSpan(map[c.most_defensible] || "?") + ")  ·  recognize: " + (c.recognize || "") + "</h4>";
          h += '<table><tr><th>Cand</th><th>source</th><th>defensibility</th><th>safe</th><th>over-cons?</th><th>issue</th></tr>';
          ["A", "B", "C"].forEach(function (l) {
            var cc = (c.candidates || {})[l] || {};
            h += "<tr><td>" + l + "</td><td>" + srcSpan(map[l] || "?") + "</td><td>" + (cc.defensibility || "") +
              "</td><td>" + (cc.safe || "") + "</td><td>" + (cc.optimus || "") + "</td><td>" + (cc.issue || "") + "</td></tr>";
          });
          h += "</table>";
        });
        if (s.overall_comment) h += '<p class="muted">Overall: ' + s.overall_comment + "</p>";
        box.innerHTML = h;
        root.appendChild(box);
      });
    }

    document.getElementById("load").onclick = function () {
      var key = document.getElementById("key").value;
      document.getElementById("err").textContent = "";
      fetch("/api/review?action=results&key=" + encodeURIComponent(key))
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (x) {
          if (!x.ok) { document.getElementById("err").textContent = x.j.error || "error"; return; }
          MAP = x.j.mapping || {};
          renderMapping(MAP);
          renderSubs(x.j.submissions || []);
          document.getElementById("gate").hidden = true;
          document.getElementById("app").hidden = false;
        })
        .catch(function (e) { document.getElementById("err").textContent = String(e); });
    };
  </script>
</body>
</html>
